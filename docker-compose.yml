# FlyWise - containerized development stack placeholder
#
# This compose file defines the services needed for the full application.
# Currently includes MySQL only; the FastAPI app will be added when its
# Dockerfile is ready.
#
# To run the frontend in development mode (with Vite dev server):
#   docker compose up mysql
#   npm run dev
#
# To build the frontend for production:
#   docker build -t flywise-frontend .
#
# When FastAPI is added, uncomment the app service and update its build context.

services:
  mysql:
    image: mysql:8.0
    container_name: flywise-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: flywise
      MYSQL_USER: flywise
      MYSQL_PASSWORD: flywise123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema migrations will be managed by FastAPI (Alembic or SQL scripts)
    command: --default-authentication-plugin=caching_sha2_password --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - flywise

  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: flywise-app
  #   environment:
  #     DB_HOST: mysql
