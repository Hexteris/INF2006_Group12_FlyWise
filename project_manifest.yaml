project:
  group_id: "Group 12"
  title: "FlyWise - Cloud-Based Flight Delay Prediction & Intelligence Application"
  problem_statement: "Passengers lack data-driven insights regarding the likelihood, timing, and severity of flight delays, creating a need for predictive machine learning analytics to identify delay patterns and provide more meaningful information about potential flight-delay risks."
  cloud_provider: "AWS"
  repository_commit: "Final"

team:
  members:
