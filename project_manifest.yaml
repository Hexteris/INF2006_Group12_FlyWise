architecture:
  diagram: "evidence/architecture.png"
  service_model: "IaaS + managed services (EC2 for compute; RDS, ALB, Auto Scaling, CloudWatch and S3 as managed services)"
  deployment_model: "Public cloud (AWS, us-east-1)"
  components:
    - name: "Application Load Balancer"
      type: "load balancer"
      role: "Receives HTTP :80 traffic and forwards it to the target group on :8000"
    - name: "EC2 instances (INF2006-WebServer1, INF2006-WebServer2)"
      type: "compute"
      role: "Run the flywise-app Docker container (React build, FastAPI, XGBoost inference) in two AZs"
    - name: "EC2 Auto Scaling group"
      type: "scaling"
      role: "Target tracking on CPU at 40% to add or remove instances"
    - name: "Amazon RDS for MariaDB (Multi-AZ)"
      type: "database"
      role: "Stores flight history, users and saved flights; standby in a second AZ"
    - name: "Amazon S3"
      type: "storage"
      role: "Private bucket holding flight_data_final.csv; automated ingestion is not established by the available documentation"
    - name: "Amazon CloudWatch"
      type: "monitoring"
      role: "CPU metrics and alarms that drive Auto Scaling"
    - name: "Aviationstack API"
      type: "external service"
      role: "Live flight information, called by the backend separately from model inference"
    - name: "Security groups"
      type: "network security"
      role: "Restrict database access to the application tier; final ALB-only access to EC2 :8000 requires verification"

