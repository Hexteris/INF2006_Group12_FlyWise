data_ai:
  dataset: "data/README.md"
  method: >-
    XGBoost binary classifier predicting whether a flight represented
    in the 2025 U.S. BTS dataset departs at least 15 minutes late
    (DepDel15). It uses 11 pre-departure features: airline, origin,
    destination, scheduled duration, distance, month, day of week,
    and scheduled departure and arrival hours and minutes.
    The training notebook records 6,879,485 eligible flights and an
    80/20 stratified split with random_state=42. Numeric median
    imputation and categorical most-frequent imputation followed by
    one-hot encoding were fitted on training rows only.
    RandomizedSearchCV used 10 candidates, three-fold cross-validation
    and ROC-AUC scoring on a stratified 300,000-row training sample.
    Class imbalance was addressed using scale_pos_weight approximately
    3.61. The final model was fitted on the full training split and
    exported for FastAPI POST /predict.
  evaluation: >-
    On 11 October 2026 at 04:55 UTC, the saved shared-Drive model
    and preprocessor were reevaluated on the original stratified
    held-out split of 1,375,897 flights. The run reproduced accuracy
    0.6463645, precision 0.3394516, recall 0.6661206, F1 0.4497254
    and ROC-AUC 0.7119550. The confusion matrix was
    [[690502, 386907], [99659, 198829]], with delayed flights as
    the positive class. An executed always-on-time baseline achieved
    accuracy 0.7830593 and zero delayed-class precision, recall and F1.
    Results, execution output and input hashes are supplied under
    evidence/model_evaluation/. This verifies the evaluated saved
    artefacts, not their consistency with the live deployment.
    Temporal evaluation, PR-AUC, completed comparisons with other
    classifiers and probability calibration remain unverified.
    Details: evidence/test-data-ai.md.
  reproducible_command: >-
    python -m pip install -r analytics/requirements-evaluation.txt &&
    python analytics/evaluate_model.py
    --artifacts "src/ML Model"
    --feature-spec analytics/evaluation_config.json
    --out evidence/model_evaluation

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: >-
    Database credentials, the Aviationstack API key and the JWT
    authentication key are supplied through environment variables.
    Local development loads a repository-root .env file, using
    src/.env.example as the placeholder template. The .env file is
    excluded from version control through .gitignore. The database
    connection requests SSL. Supporting code/configuration evidence
    is referenced in evidence/threat-control-map.md.
    Deployment notes record an administrative database account;
    migration to a least-privilege application account remains
    unverified. Public application access uses HTTP. Final ALB-only
    EC2 access and comprehensive secret-handling verification remain
    outstanding.

run:
  url: "http://inf2006-flywise-alb-1672116072.us-east-1.elb.amazonaws.com/"
  prerequisites:
    - "Node.js and npm"
    - "Python compatible with src/requirements.txt"
    - "Access to a configured MariaDB database named group_project"
    - "Required application tables and historical/reference data loaded"
    - "Repository-root .env configured using src/.env.example"
    - "Saved model artefacts present in src/ML Model/"
    - "Aviationstack credentials for live-flight functionality"
  # Execute from the repository root.
  # Start the backend and frontend in separate terminals.
  commands:
    - "python -m pip install -r src/requirements.txt"
    - "npm --prefix src install"
    - "npm --prefix src run build"
    - "python -m uvicorn src.FastAPI:app --reload --port 8000"
    - "npm --prefix src run dev"

