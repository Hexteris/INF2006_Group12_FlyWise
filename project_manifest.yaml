  functional_test: "evidence/test-functional.md"
  security_test: "evidence/test-security.md"
  data_ai_test: "evidence/test-data-ai.md"
  scale_resilience_test: "evidence/test-resilience.md"
  monitoring: "evidence/monitoring.md"

data_ai:
  dataset: "data/README.md"
  method: >-
    XGBoost binary classifier predicting whether a U.S. domestic flight departs
    at least 15 minutes late (BTS DepDel15), using 11 pre-departure features:
    airline, origin, destination, scheduled duration, distance, month, day of
    week, and scheduled departure and arrival hours and minutes. Trained on
    6,879,485 cleaned 2025 BTS flights. One-hot encoding and median imputation
    were fitted on training rows only. RandomizedSearchCV tuning used 10
    candidates and 3 folds with ROC-AUC scoring. Class imbalance was addressed
    using scale_pos_weight=3.61. The model was compared against Logistic
    Regression, Decision Tree and Random Forest classifiers. The final model
    is served through FastAPI POST /predict.
  evaluation: >-
    Stratified 80/20 hold-out evaluation on 1,375,897 test flights: ROC-AUC
    0.712, recall 0.666, precision 0.340, F1 0.450 and PR-AUC 0.409.
    Temporal hold-out evaluation, training on January to September and testing
    on October to December, achieved ROC-AUC 0.677. The deployed model
    artefacts were re-scored on 10 October 2026 and reproduced the recorded
    metrics. Scores are uncalibrated risk scores, not calibrated probabilities.
    Details: evidence/test-data-ai.md
  reproducible_command: >-
    pip install -r analytics/requirements.txt &&
    python analytics/evaluate_model.py --raw-dir
    "<folder with flight_delays_2025_*.csv>"

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: ""

run:
  url: "http://inf2006-flywise-alb-1672116072.us-east-1.elb.amazonaws.com/"
  # The prerequisites and commands below are for local development and testing. 
  # The deployed application is already running on AWS Cloud using the URL above.
  prerequisites:
    - "Node.js and npm"
    - "Python and pip"
    - "Access to a configured MariaDB database"
    - "Environment variables configured for database connectivity and application settings"
  commands:
    - "pip install -r requirements.txt"
    - "npm install"
    - "python -m uvicorn src.FastAPI:app --reload"
    - "npm --prefix src run dev"

