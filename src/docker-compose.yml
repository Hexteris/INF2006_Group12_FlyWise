services:
  app:
    build:
      context: ..
      dockerfile: src/Dockerfile
    container_name: flywise-app
    env_file:
      - ../.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL_MODE:-true}
    ports:
      - "8000:8000"
    restart: unless-stopped
